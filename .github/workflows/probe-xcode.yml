name: probe-xcode

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: macos-14
    steps:
      - name: Versions
        run: |
          ls -d /Applications/Xcode*.app || true
          for app in /Applications/Xcode*.app; do
            echo "== $app"
            defaults read "$app/Contents/version.plist" CFBundleShortVersionString 2>/dev/null ||               /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/version.plist"
            SDK=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun -sdk iphoneos --show-sdk-version 2>/dev/null || echo none)
            echo "   iphoneos sdk: $SDK"
          done
