name: probe-sdk2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xtool
        with:
          min-sdk-major: "18"
      - name: Install the Darwin SDK from the selected Xcode
        run: |
          set -x
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "using $XCODE"
          xtool sdk install "$XCODE"
          xtool sdk status
      - name: Build
        run: |
          set -x
          xtool dev build -c release --ipa
          ls -la xtool
