name: probe-xtool-sdk

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xtool
        with:
          min-sdk-major: "18"
      - name: SDK install
        run: |
          set -x
          xtool sdk --help || true
          xtool sdk install --help || true
          timeout 900 xtool sdk install || echo "install exit $?"
          xtool sdk status || true
      - name: Build
        run: |
          set -x
          timeout 900 xtool dev build -c release --ipa || echo "build exit $?"
          ls -la xtool || true
