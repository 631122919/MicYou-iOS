name: probe-xcodeproj

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xtool
        with:
          min-sdk-major: "18"
      - name: Generate the Xcode project
        run: |
          set -x
          xtool dev generate-xcode-project || true
          ls -la
          ls -la *.xcodeproj 2>&1 | head
      - name: Build with xcodebuild
        run: |
          set -x
          PROJECT=$(ls -d *.xcodeproj | head -1)
          xcodebuild -project "$PROJECT" -list
          xcodebuild -project "$PROJECT" -scheme MicYou -configuration Release             -sdk iphoneos -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build || true
          find . -name '*.app' -maxdepth 6 2>/dev/null | head
