name: iOS 16 IPA

# Builds an unsigned IPA with an iOS 16 deployment target, for a device that cannot run the
# upstream release (iOS 17 and later). Runs on a macOS runner, no Mac needed locally.
# A successful build is published as a release asset, so the IPA can be downloaded from a
# browser without anyone watching the run
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xtool

      - name: Build IPA
        run: Tools/build-ipa.sh
        timeout-minutes: 30

      - name: Verify
        run: Tools/verify-ipa16.sh

      - uses: actions/upload-artifact@v7
        with:
          name: MicYou-iOS16
          path: xtool/MicYou.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish the IPA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios16-latest >/dev/null 2>&1 || gh release create ios16-latest \
            --title "MicYou for iOS 16" \
            --notes "Unsigned IPA built from the iOS 16 port. Sign it with AltStore, SideStore, Sideloadly or TrollStore."
          gh release upload ios16-latest xtool/MicYou.ipa --clobber
