name: iOS 16 IPA

# Builds an unsigned IPA with an iOS 16 deployment target, for a device that cannot run the
# upstream release (iOS 17 and later). macos-14 is the only image that gets a runner here.
# xtool needs Swift 6.1 for the implicit Darwin Swift SDK, the image has 6.0, so a 6.2
# toolchain is installed and selected through TOOLCHAINS
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the Swift 6.2 toolchain
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.pkg" \
            https://download.swift.org/swift-6.2.2-release/xcode/swift-6.2.2-RELEASE/swift-6.2.2-RELEASE-osx.pkg
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          echo "TOOLCHAINS=swift" >> "$GITHUB_ENV"
          export TOOLCHAINS=swift
          swift --version

      - uses: ./.github/actions/setup-xtool
        with:
          min-sdk-major: "18"

      - name: Make the scripts executable
        run: chmod +x Tools/*.sh

      - name: Build IPA
        run: bash Tools/build-ipa.sh
        timeout-minutes: 40

      - name: Verify
        run: bash Tools/verify-ipa16.sh

      - uses: actions/upload-artifact@v7
        with:
          name: MicYou-iOS16
          path: xtool/MicYou.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish the IPA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios16-latest >/dev/null 2>&1 || gh release create ios16-latest \
            --title "MicYou for iOS 16" \
            --notes "Unsigned IPA built from the iOS 16 port. Sign it with AltStore, SideStore, Sideloadly or TrollStore."
          gh release upload ios16-latest xtool/MicYou.ipa --clobber