name: probe-xtool

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xtool
        with:
          min-sdk-major: "18"
      - name: Diagnostics
        run: |
          set -x
          sw_vers
          xcode-select -p
          swift --version
          which swift swiftc
          ls -la "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/" | head -40
          echo "--- swift-sdks candidates ---"
          ls -la ~/Library/org.swift.swiftpm 2>&1 | head -20
          ls -la ~/Library/org.swift.swiftpm/swift-sdks 2>&1 | head -20
          ls -la /Library/Developer/CommandLineTools/usr/lib/swift-sdks 2>&1 | head
          echo "--- xtool ---"
          xtool --version
          xtool sdk status 2>&1 | head -30
          xtool dev --help 2>&1 | head -40
          echo "--- real build attempt ---"
          xtool dev build --help 2>&1 | head -40
